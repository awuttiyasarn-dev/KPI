
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REPORT | Nakornping Hospital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #176b62;
      --primary-dark: #104c47;
      --bg: #f3f7f8;
      --line: #e2e8f0;
      --text: #172b36;
      --muted: #657782;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Kanit', sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .topbar {
      padding: 22px clamp(16px, 4vw, 48px);
      color: white;
      background: linear-gradient(120deg, var(--primary-dark), #238b7b);
    }

    .topbar small {
      opacity: .85;
      letter-spacing: 1px;
    }

    .topbar h1 {
      margin: 5px 0;
      font-size: clamp(24px, 3vw, 34px);
    }

    .topbar p {
      margin: 0;
      opacity: .88;
    }

    main {
      max-width: 1400px;
      margin: 26px auto;
      padding: 0 18px 36px;
    }

    .notice {
      border: 1px solid #b8ded5;
      background: #eaf7f3;
      color: #14594e;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .panel {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 24px #183e4a0b;
      overflow: hidden;
    }

    .panel-head {
      padding: 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 20px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .controls {
      padding: 16px 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    input, select, button {
      font: inherit;
      border-radius: 9px;
      padding: 9px 12px;
    }

    input, select {
      border: 1px solid #cbd5df;
      background: white;
      color: var(--text);
    }

    input {
      width: min(100%, 360px);
    }

    button {
      border: 0;
      cursor: pointer;
      background: var(--primary);
      color: white;
    }

    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: .4; cursor: not-allowed; }

    .secondary {
      background: #edf3f5;
      color: #23414b;
    }

    .secondary:hover { background: #dce8eb; }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border-top: 1px solid var(--line);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f6f9fa;
      color: #31515b;
      font-weight: 500;
    }

    tbody tr:hover { background: #f7fbfa; }

    .status {
      padding: 14px 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px 20px;
    }

    .pager-buttons {
      display: flex;
      gap: 8px;
    }

    .error {
      color: #a12626;
      background: #fff0f0;
      padding: 14px 20px;
      white-space: pre-wrap;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .panel-head, .controls, .pagination { padding: 14px; }
      .controls input { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <small>NAKORNPING HOSPITAL · DATA SERVICES</small>
    <h1>REPORT</h1>
    <p>ระบบรายงานข้อมูลสรุป</p>
  </header>

  <main>
    <div class="notice">
      หน้านี้เผยแพร่เฉพาะข้อมูลสรุปที่ผ่านการคัดกรองแล้ว
      ไม่ใช่ระบบค้นหาประวัติผู้ป่วยรายบุคคล
    </div>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>ฐานข้อมูลรายงาน</h2>
          <div class="muted" id="summary">กำลังเชื่อมต่อข้อมูล...</div>
        </div>
        <button id="exportBtn" class="secondary" type="button">
          ส่งออก CSV (หน้านี้)
        </button>
      </div>

      <div class="controls">
        <input id="searchInput" type="search"
          placeholder="ค้นหาจากข้อมูลสรุป..." autocomplete="off">
        <label for="pageSize" class="muted">แสดงต่อหน้า</label>
        <select id="pageSize">
          <option value="10">10</option>
          <option value="25" selected>25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
        <button id="searchBtn" type="button">ค้นหา</button>
        <button id="resetBtn" class="secondary" type="button">ล้างคำค้น</button>
      </div>

      <div id="errorBox" class="error" hidden></div>
      <div class="table-wrap">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="tableBody">
            <tr><td>กำลังโหลด...</td></tr>
          </tbody>
        </table>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
      <div class="pagination">
        <span id="pageInfo" class="muted">หน้า 1</span>
        <div class="pager-buttons">
          <button id="prevBtn" class="secondary" type="button">ก่อนหน้า</button>
          <button id="nextBtn" type="button">ถัดไป</button>
        </div>
      </div>
    </section>
  </main>

  <footer>REPORT · Public Summary API</footer>

  <script>
    // เปลี่ยนเป็น URL Web App ที่ลงท้ายด้วย /exec
    const API_URL =
      'https://script.google.com/macros/s/AKfycbyDVuHOl48Fke6Sb7D-MsVSUC4lPlOpe03mw63JdNtn9OU5Y1cGW_64Ly15JUA4p4qF/exec';

    const state = {
      page: 1,
      pageSize: 25,
      query: '',
      headers: [],
      rows: [],
      total: 0,
      totalPages: 1,
      loading: false
    };

    const $ = id => document.getElementById(id);

    // JSONP สำหรับอ่านข้อมูลสาธารณะจาก Apps Script
    let requestNumber = 0;

    function apiGet(params) {
      return new Promise((resolve, reject) => {
        const callbackName = 'reportCallback_' + (++requestNumber);
        const script = document.createElement('script');
        let finished = false;

        const cleanup = () => {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          delete window[callbackName];
          script.remove();
        };

        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error(
            'เชื่อมต่อ API ไม่สำเร็จ กรุณาตรวจ URL /exec และสิทธิ์ Deploy'
          ));
        }, 20000);

        window[callbackName] = data => {
          cleanup();
          if (!data || data.ok !== true) {
            reject(new Error(data?.error || 'API ส่งข้อมูลไม่สำเร็จ'));
            return;
          }
          resolve(data);
        };

        const query = new URLSearchParams({
          ...params,
          callback: callbackName,
          _: String(Date.now())
        });

        script.onerror = () => {
          cleanup();
          reject(new Error('โหลด API ไม่สำเร็จ'));
        };

        script.src = API_URL + '?' + query.toString();
        document.head.appendChild(script);
      });
    }

    function showError(message) {
      $('errorBox').hidden = false;
      $('errorBox').textContent = message;
    }

    function clearError() {
      $('errorBox').hidden = true;
      $('errorBox').textContent = '';
    }

    // ใช้ textContent เพื่อป้องกันข้อมูลในชีตกลายเป็น HTML
    function renderTable() {
      const head = $('tableHead');
      const body = $('tableBody');
      head.replaceChildren();
      body.replaceChildren();

      const headerRow = document.createElement('tr');
      state.headers.forEach(label => {
        const th = document.createElement('th');
        th.textContent = label;
        headerRow.appendChild(th);
      });
      head.appendChild(headerRow);

      if (!state.rows.length) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = Math.max(state.headers.length, 1);
        td.textContent = 'ไม่พบข้อมูล';
        tr.appendChild(td);
        body.appendChild(tr);
      } else {
        state.rows.forEach(row => {
          const tr = document.createElement('tr');
          row.forEach(value => {
            const td = document.createElement('td');
            td.textContent = value == null ? '' : String(value);
            tr.appendChild(td);
          });
          body.appendChild(tr);
        });
      }

      $('summary').textContent =
        'ข้อมูลทั้งหมด ' + state.total.toLocaleString('th-TH') + ' รายการ';

      $('pageInfo').textContent =
        'หน้า ' + state.page + ' / ' + state.totalPages;

      $('status').textContent = state.loading
        ? 'กำลังโหลดข้อมูล...'
        : 'แสดง ' + state.rows.length + ' รายการในหน้านี้';

      $('prevBtn').disabled = state.loading || state.page <= 1;
      $('nextBtn').disabled =
        state.loading || state.page >= state.totalPages;
      $('searchBtn').disabled = state.loading;
      $('exportBtn').disabled = state.loading || !state.rows.length;
    }

    async function loadData() {
      if (state.loading) return;

      state.loading = true;
      clearError();
      renderTable();

      try {
        const result = await apiGet({
          action: 'data',
          sheet: 'REPORT_02',
          page: String(state.page),
          pageSize: String(state.pageSize),
          query: state.query
        });

        state.headers = result.headers || [];
        state.rows = result.rows || [];
        state.total = Number(result.total || 0);
        state.totalPages = Math.max(1, Number(result.totalPages || 1));
        state.page = Number(result.page || 1);
      } catch (err) {
        state.rows = [];
        state.total = 0;
        showError(err.message || String(err));
      } finally {
        state.loading = false;
        renderTable();
      }
    }

    function csvEscape(value) {
      let text = String(value == null ? '' : value);
      // ป้องกัน CSV formula injection เมื่อเปิดไฟล์ด้วยโปรแกรมตารางคำนวณ
      if (/^[\s]*[=+\-@]/.test(text)) text = "'" + text;
      return '"' + text.replace(/"/g, '""') + '"';
    }

    function exportCurrentPage() {
      if (!state.rows.length) return;

      const lines = [
        state.headers.map(csvEscape).join(','),
        ...state.rows.map(row => row.map(csvEscape).join(','))
      ];

      const blob = new Blob(
        ['\uFEFF' + lines.join('\r\n')],
        { type: 'text/csv;charset=utf-8;' }
      );

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'REPORT_PUBLIC_SUMMARY_page_' + state.page + '.csv';
      link.click();
      URL.revokeObjectURL(url);
    }

    $('searchBtn').addEventListener('click', () => {
      state.query = $('searchInput').value.trim();
      state.page = 1;
      loadData();
    });

    $('searchInput').addEventListener('keydown', event => {
      if (event.key === 'Enter') $('searchBtn').click();
    });

    $('resetBtn').addEventListener('click', () => {
      $('searchInput').value = '';
      state.query = '';
      state.page = 1;
      loadData();
    });

    $('pageSize').addEventListener('change', event => {
      state.pageSize = Number(event.target.value) || 25;
      state.page = 1;
      loadData();
    });

    $('prevBtn').addEventListener('click', () => {
      if (state.page > 1) {
        state.page--;
        loadData();
      }
    });

    $('nextBtn').addEventListener('click', () => {
      if (state.page < state.totalPages) {
        state.page++;
        loadData();
      }
    });

    $('exportBtn').addEventListener('click', exportCurrentPage);

    loadData();
  </script>
</body>
</html>
